name: OTA update

# Publishes the selected branch's JS bundle to the production channel. Use it
# for JS/asset-only changes; native changes need a GitHub Release
# (release-submit.yml).
on:
  workflow_dispatch:
    inputs:
      message:
        description: "Optional update message (defaults to the head commit subject)"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: ota-update-production
  cancel-in-progress: false

jobs:
  ota_update:
    name: Publish production OTA update
    runs-on: ubuntu-latest
    environment: production-release
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Load App release credentials
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: aa215703-79a0-41d5-b109-425f93d4ae13
          oidc-audience: https://secrets.samfunnetibergen.no
          domain: https://secrets.samfunnetibergen.no
          project-id: 341d1d76-faec-4f20-92f6-7a40da6fc7e9
          env-slug: prod
          secret-path: /app
          export-type: env

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ env.EXPO_TOKEN }}

      - name: Publish update
        env:
          MESSAGE: ${{ inputs.message }}
        run: |
          set -euo pipefail
          MESSAGE="${MESSAGE:-$(git log -1 --format=%s)}"
          RUNTIME="$(node -p 'require("./app.json").expo.version')"

          eas update \
            --channel production \
            --environment production \
            --platform all \
            --message "${MESSAGE}" \
            --non-interactive \
            --json | tee eas-update.json

          DASHBOARD_URL="$(node -p 'const u = [].concat(require("./eas-update.json")); u.map(i => i.dashboardUrl || i.url).find(Boolean) || ""')"
          {
            echo "## Production OTA update"
            echo "- Runtime: \`${RUNTIME}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Message: ${MESSAGE}"
            echo "- Dashboard: ${DASHBOARD_URL:-n/a}"
          } >> "${GITHUB_STEP_SUMMARY}"
